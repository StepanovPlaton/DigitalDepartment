<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto&display=swap");
      body {
        margin: 0;
        padding: 0;
        background-color: #f3f4f6;
        font-family: "Roboto", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      form {
        background-color: #fff;
        padding: 16px;
        border-radius: 4px;
        width: 100%;
        max-width: 320px;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
      }
      h1 {
        font-weight: 800;
        font-size: 15px;
        color: #c96f56;
        text-align: center;
        margin: 0 0 8px 0;
        user-select: none;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 400;
        color: #111827;
        margin-bottom: 4px;
        user-select: none;
        line-height: 1.2;
      }
      p {
        font-size: 13px;
        font-weight: 400;
        color: #1d4ed8;
        margin-top: 0;
        margin-bottom: 8px;
        user-select: text;
        cursor: text;
        text-align: center;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        height: 32px;
        font-size: 13px;
        padding: 4px 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        margin-bottom: 8px;
        box-sizing: border-box;
        background-color: #ebf2ff;
        outline: none;
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }
      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: #c96f56;
        box-shadow: 0 0 0 1px #c96f56;
        background-color: #ebf2ff;
      }
      button {
        display: block;
        margin: 0 auto;
        padding: 6px 24px;
        font-size: 13px;
        font-weight: 400;
        color: #fff;
        background: linear-gradient(to bottom, #c96f56, #a14f3e);
        border: none;
        border-radius: 20px;
        box-shadow: 0 3px 0 #8e4a36;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s ease;
        white-space: nowrap;
      }
      button:hover {
        background: linear-gradient(to bottom, #b35f4a, #8e4a36);
      }
      button:active {
        box-shadow: 0 2px 0 #8e4a36;
      }
      .checkbox-container {
        margin-top: 12px;
        display: flex;
        align-items: center;
        user-select: none;
        font-size: 13px;
        color: #111827;
      }
      .checkbox-container input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-right: 8px;
        cursor: pointer;
      }
      @media (max-width: 400px) {
        form {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <form>
      <h1>ВХОД</h1>
      <label for="ip">IP-адрес компьютера :</label>
      <p id="ip">127.0.0.1</p>

      <label for="org">Название организации :</label>
      <p id="org">не определена</p>

      <label for="username">Имя пользователя<br />или адрес эл. почты :</label>
      <input id="username" type="text" />

      <label for="password">Пароль:</label>
      <input id="password" type="password" />

      <button type="submit">Вход</button>

      <div class="checkbox-container">
        <input id="remember" type="checkbox" />
        <label for="remember">Запомнить меня</label>
      </div>
    </form>
  </body>
</html>
